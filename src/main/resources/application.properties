# ============================================================
# Standard Spring Boot properties to set up persistence
# =============================================================
# The name of this app:
spring.application.name=hrOnSpring40
server.port=8080

# =============================================================
# Logging on
# =============================================================
logging.level.com.harbormaster=debug

# =============================================================
# The default profiles are "all of them"
# =============================================================
spring.profiles.active=null
 
# =============================================================
# spring jpa/hibernate params
# =============================================================
spring.jpa.properties.hibernate.dialect=
spring.datasource.url=jdbc:mysql://localhost:3306/banking-on-spring-boot
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=
spring.datasource.username=root
spring.datasource.password=null
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# =============================================================
# enable security support - jwt, form-login, oauth2,  apikey
# =============================================================
hm.security.authentication=none

# =============================================================
# opentelemetry
# =============================================================
management.endpoints.web.exposure.include=health,info,metrics


logging.structured.format.console=logstash


springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.threads.virtual.enabled=true